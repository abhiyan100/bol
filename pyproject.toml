[project]
name = "bol"
version = "0.1.0"
description = "Speak. Bol runs Claude Code hands-free: dictate, command, and hear back what happened."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Abhiyan Poudel" }]
keywords = ["claude-code", "voice", "dictation", "hands-free", "stt", "tts"]
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "pynput>=1.7.6",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
stt = ["parakeet-mlx>=0.3"]
llm = ["mlx-lm>=0.24"]
# misaki's G2P needs spacy + friends; we list them directly instead of
# misaki[en] because that extra drags in torch (~500MB) via
# spacy-curated-transformers, which the mlx pipeline never uses.
# The en_core_web_sm wheel is pinned so first synthesis never falls back to
# a blocking spacy.cli.download() (which fails offline).
kokoro = [
    "mlx-audio>=0.2",
    "misaki>=0.6",
    "spacy>=3.8,<3.9",
    "num2words",
    "phonemizer-fork",
    "espeakng-loader",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
all = ["bol[stt,llm,kokoro]"]

[tool.uv]
# Bol is a macOS tool; keep Linux/CUDA wheels out of the lock.
environments = ["sys_platform == 'darwin'"]

[project.scripts]
bol = "bol.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bol"]

[tool.hatch.metadata]
# The pinned en_core_web_sm wheel URL in the kokoro extra needs this.
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
