[project]
name = "bol"
version = "0.4.0"
description = "Speak. Bol runs Claude Code hands-free: dictate, command, and hear back what happened."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Abhiyan Poudel" }]
keywords = ["claude-code", "voice", "dictation", "hands-free", "stt", "tts", "mlx", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "pynput>=1.7.6",
    "tomli-w>=1.0",
    # Silero v6 voice activity detection: a 2.4 MB abi3 wheel with no
    # dependencies of its own (it bundles onnxruntime-free inference), so it
    # is a base dependency rather than an extra. Endpointing is what decides
    # whether a hands-free turn ends when you stop talking, and an energy
    # gate cannot tell a keyboard from a syllable.
    "pysilero-vad>=3.4; platform_machine == 'arm64'",
]

[project.optional-dependencies]
stt = ["parakeet-mlx>=0.3"]
llm = ["mlx-lm>=0.24"]
# "hey Bol". sherpa-onnx is a 2 MB wheel plus its 9.5 MB core (which bundles
# onnxruntime), and it is loaded only in the wake child process, never in the
# daemon. sentencepiece turns a wake phrase into the BPE pieces the keyword
# model can actually emit; without it a phrase can only be guessed at.
wake = ["sherpa-onnx>=1.13", "sentencepiece>=0.2"]
# misaki's G2P needs spacy + friends; we list them directly instead of
# misaki[en] because that extra drags in torch (~500MB) via
# spacy-curated-transformers, which the mlx pipeline never uses.
# The en_core_web_sm wheel is pinned so first synthesis never falls back to
# a blocking spacy.cli.download() (which fails offline).
kokoro = [
    "mlx-audio>=0.2",
    "misaki>=0.6",
    "spacy>=3.8,<3.9",
    "num2words",
    "phonemizer-fork",
    "espeakng-loader",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
all = ["bol[stt,llm,kokoro,wake]"]

[project.urls]
Homepage = "https://bol-voice.vercel.app"
Repository = "https://github.com/abhiyan100/bol"
Issues = "https://github.com/abhiyan100/bol/issues"

[tool.uv]
# Bol is a macOS tool; keep Linux/CUDA wheels out of the lock.
environments = ["sys_platform == 'darwin'"]

[project.scripts]
bol = "bol.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bol"]

[tool.hatch.metadata]
# The pinned en_core_web_sm wheel URL in the kokoro extra needs this.
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
